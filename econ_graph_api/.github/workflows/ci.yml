name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: econ
          POSTGRES_USER: econ_user
          POSTGRES_PASSWORD: econ_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econ_user -d econ"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://econ_user:econ_pass@localhost:5432/econ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests with pytest
        run: |
          pytest -v --tb=short --cov=app --cov-report=term-missing

      - name: Check code formatting with black
        run: |
          pip install black
          black --check app/ tests/

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker compose build --no-cache

      - name: Test Docker stack
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/metrics || exit 1
          docker compose down -v
